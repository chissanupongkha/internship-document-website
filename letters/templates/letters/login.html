{% extends 'letters/base.html' %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white border border-[#E1DACB] rounded-xl p-8 shadow-sm">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Staff Portal</h2>
      <p class="text-xs text-gray-500 mt-1">Sign in with your administrator-assigned credentials</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-xs font-semibold">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1 uppercase">Username</label>
            <input type="text" name="username" required 
                   class="w-full px-3 py-2 border border-[#E1DACB] rounded-lg text-sm focus:ring-1 focus:ring-[#3F7A62] focus:outline-none">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1 uppercase">Password</label>
            <input type="password" name="password" required 
                   class="w-full px-3 py-2 border border-[#E1DACB] rounded-lg text-sm focus:ring-1 focus:ring-[#3F7A62] focus:outline-none">
        </div>
        <button type="submit" class="w-full py-2.5 px-4 bg-[#3F7A62] hover:bg-[#32624e] text-white font-semibold rounded-lg text-sm shadow-sm transition-colors">
            Log In
        </button>
    </form>
</div>
{% endblock %}
